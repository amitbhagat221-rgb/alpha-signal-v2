# Preview of the Cockpit v2 layout (read-only copy of the new site map), one host per app.
# Backends: alpha-cockpit-preview (127.0.0.1:3002), alpha-cockpit-ops-preview (127.0.0.1:3003).
# certbot adds the 443 listener. webauth sets the session cookie per host and marks it Secure
# from X-Forwarded-Proto, so each host asks for the password once.
# Versioned copy: ~/alpha-signal-v2/ops/nginx/alpha-preview.conf
server {
    server_name preview.rendezvous-app.duckdns.org;
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;          # a cold page can take a minute
    }

    listen 80;
}

server {
    server_name preview-ops.rendezvous-app.duckdns.org;
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;          # a cold page can take a minute
    }

    listen 80;
}

# Alpha Signal ops cockpit (Boardroom) over HTTPS, so the page installs as an app on a phone
# and the login travels encrypted. Proxies to the uvicorn service on 127.0.0.1:3001.
# Versioned copy: ~/alpha-signal-v2/ops/nginx/alpha-ops.conf
server {
    server_name alpha.rendezvous-app.duckdns.org;
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;          # a chat turn or the health page can take minutes
    }

    location /api/org/chat/ {             # live chat: stream the reply, do not buffer it
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    listen 80;
}

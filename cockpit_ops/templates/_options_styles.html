{# Styles shared by the options pages (/options, /options/capital, /options/live). #}
<style>
  .ob-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 12px 0 20px; }
  .ob-tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .ob-tile .n { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; line-height: 1.1; }
  .ob-tile .l { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .ob-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .ob-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .ob-btn { display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; text-decoration: none; }
  .ob-ok { color: var(--green); } .ob-warn { color: var(--amber); } .ob-bad { color: var(--red); }
  .ob-muted { color: var(--text-secondary); font-size: 12px; }
  .ob-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ob-table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); padding: 8px; }
  .ob-table td { padding: 8px; border-top: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .ob-table td.ob-wrap { white-space: normal; min-width: 160px; }
  .ob-scroll { overflow-x: auto; }
  .ob-rule td:first-child { color: var(--text-muted); font-family: inherit; width: 140px; }
  .ob-rule td { font-family: inherit; white-space: normal; }
  .ob-cap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .ob-cap input { width: 150px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input, var(--bg-card)); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .ob-table td.ob-scaled { font-weight: 700; }
  tr.ob-trade:hover td { background: var(--bg-hover, rgba(255,255,255,0.02)); }
  .ob-cap-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .ob-cap-h { font-size: 15px; min-width: 64px; }
  .ob-cap-sub { margin-top: 10px; }
  .ob-cap-input { max-width: 100%; }
  .ob-cap-reset { white-space: nowrap; }
  .ob-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ob-tab { border: 1px solid var(--border); background: transparent; color: var(--text-secondary); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; }
  .ob-tab-on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #ob-capital[data-mode="winged"] .ob-only-naked, #ob-capital:not([data-mode="winged"]) .ob-only-winged { display: none; }
  .ob-cap-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 12px; }
  .ol-live { border-color: var(--accent); }
  .ol-sub { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .ol-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .ol-act, .ol-save, .ol-apply { border: 0; cursor: pointer; font-family: inherit; }
  .ol-cur td { background: var(--bg-hover, rgba(127,127,127,0.12)); }
  .ol-btn-stop { background: var(--red); }
  .ol-mode { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.4px; background: var(--bg-hover, rgba(127,127,127,0.15)); }
  .ol-mode-shadow { color: var(--text-secondary); }
  .ol-mode-approve { color: var(--amber); }
  .ol-mode-auto, .ol-mode-kill { color: #fff; background: var(--red); }
  .ol-mode-off { color: var(--text-muted); }
  .ol-set { margin-top: 8px; }
  .ol-set select, .ol-set input[type=number] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input, var(--bg-card)); color: var(--text-primary); font-size: 14px; width: 120px; }
  /* the options sub-pages' layout and the strategy builder (_options_builder.html) */
  .os-grid { display: grid; grid-template-columns: minmax(260px, 330px) minmax(0, 1fr) minmax(230px, 290px); gap: 16px; align-items: start; }
  .os-grid > * { min-width: 0; }
  .os-left, .os-main, .os-right { align-self: start; }
  .os-u-name { font-weight: inherit; }
  @media (max-width: 1280px) { .os-grid { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); } .os-right { grid-column: 1 / -1; } }
  @media (max-width: 820px) { .os-grid { grid-template-columns: minmax(0, 1fr); } }
  .os-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .os-panel + .os-panel { margin-top: 16px; }
  .os-panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 15px; }
  .os-leg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .os-leg .os-sub { grid-column: 2 / -1; font-family: inherit; }
  .os-tag-s, .os-tag-b { display: inline-block; min-width: 20px; text-align: center; padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: 800; font-family: Inter, sans-serif; }
  .os-tag-s { color: var(--red); background: var(--red-bg); }
  .os-tag-b { color: var(--green); background: var(--green-bg); }
  .os-legs-total { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); font-weight: 800; }
  .os-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; }
  .os-ml { display: block; font-size: 12px; color: var(--text-secondary); }
  .os-mv { display: block; font-size: 19px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .os-be { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
  .os-be b { font-family: 'JetBrains Mono', monospace; }
  .os-chart { position: relative; height: 380px; margin-top: 8px; }
  @media (max-width: 820px) { .os-chart { height: 300px; } }
  .os-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--text-secondary); margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--bg-hover, rgba(127,127,127,0.08)); }
  .os-key { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .os-key-box { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; opacity: 0.45; }
  .os-foot { text-align: center; margin-top: 8px; font-size: 13px; }
  .os-foot b { font-family: 'JetBrains Mono', monospace; font-size: 15px; }
  .os-opts { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 10px 0 6px; font-size: 13px; color: var(--text-secondary); }
  .os-opts select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-input, var(--bg-card)); color: var(--text-primary); }
  .os-cur td { background: rgba(245, 158, 11, 0.10); }
  .os-total td { font-weight: 800; }
  .os-table td a { color: inherit; text-decoration: none; }
  .os-sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 24px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .os-slider-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; }
  .os-slider input[type=range] { width: 100%; margin-top: 10px; accent-color: var(--blue); }
  .os-step { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .os-step button { border: 0; background: transparent; color: var(--text-primary); padding: 4px 10px; cursor: pointer; font-size: 15px; }
  .os-step input { width: 96px; border: 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--bg-input, var(--bg-card)); color: var(--text-primary); padding: 5px 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: center; }
  .os-link { color: var(--accent); text-decoration: none; font-weight: 700; margin-left: 6px; }
  .os-sum { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 13px; border-top: 1px solid var(--border); }
  .os-sum:first-of-type { border-top: 0; }
  .os-sum > span:first-child { color: var(--text-secondary); }
  .os-sum > span:last-child { font-family: 'JetBrains Mono', monospace; font-weight: 700; text-align: right; }
  .os-field { display: block; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
  .os-field input, .os-field select { display: block; width: 100%; margin-top: 4px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input, var(--bg-card)); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .os-warn { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(245, 158, 11, 0.10); color: var(--amber); font-size: 12px; }
  .os-bars { position: relative; height: 240px; margin-top: 10px; }
</style>

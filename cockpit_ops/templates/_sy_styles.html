{# Health / Feeds shared styles (the sy-* classes). #}
<style>
/* state colour: one class sets --c from the severity / status the report gave */
.st-ok { --c: var(--green); } .st-watch, .st-warn { --c: var(--amber); } .st-broken, .st-critical { --c: var(--red); }
.st-info { --c: var(--text-muted); } .st-none { --c: var(--border-accent); }
.sy-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.sy-actions { display: flex; gap: 8px; }
.sy-btn { padding: 8px 14px; background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 8px;
          text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: .3px; }
.sy-btn-primary { background: var(--accent); color: var(--text-primary); border-color: var(--accent); }
.sy-card { margin-bottom: 14px; border-left: 4px solid var(--c); }
.sy-eyebrow { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.sy-verdict { font-size: 22px; font-weight: 800; color: var(--c); }
.sy-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }
.sy-qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.sy-q { text-decoration: none; color: inherit; display: block; border-top: 3px solid var(--c); }
.sy-q-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.sy-q-t { font-size: 13px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
.sy-q-m { font-size: 16px; font-weight: 800; color: var(--c); line-height: 1; }
.sy-q-s { font-size: 12px; font-weight: 600; color: var(--c); margin-bottom: 4px; }
.sy-q-f { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
.sy-q-c { font-size: 10px; color: var(--text-muted); line-height: 1.4; margin-top: 6px; }
.sy-strip { display: none; margin-bottom: 14px; }
.sy-strip a { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; text-decoration: none; color: var(--text-primary); font-size: 12px;
              background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--c); border-radius: 6px; margin-bottom: 4px; }
.sy-strip b { color: var(--c); } .sy-strip span { color: var(--text-muted); margin-left: auto; text-align: right; }
@media (max-width: 600px) { .sy-qs { display: none; } .sy-strip { display: block; } .sy-verdict { font-size: 18px; } }
.sy-title { margin-bottom: 6px; } .sy-title-c { color: var(--c); }
.sy-issue { padding: 12px 0; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.sy-issue .pill { flex: none; }
.sy-issue-b { flex: 1; min-width: 0; }
.sy-issue-m { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.4; }
.sy-issue-d { font-size: 11px; color: var(--text-secondary); line-height: 1.5; margin-top: 4px; overflow-wrap: anywhere; }
.sy-issue-w { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; margin-top: 6px; }
.sy-issue-w + .sy-issue-w { margin-top: 0; }
.sy-issue-f { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
.sy-new { color: var(--accent); } .sy-standing { color: var(--amber); }
.sy-link { color: var(--accent); text-decoration: none; }
.sy-empty { padding: 30px; text-align: center; color: var(--green); font-size: 14px; }
.sy-fold { text-transform: inherit; font-weight: inherit; letter-spacing: inherit; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.sy-fold-i { font-size: 18px; color: var(--text-muted); }
.sy-tol { padding: 7px 0; border-top: 1px solid var(--border); font-size: 12px; }
.sy-tol .mono { color: var(--text-muted); font-size: 11px; }
.sy-sub { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px; color: var(--c); }
.sy-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sy-table th { padding: 8px 10px; text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
               color: var(--text-muted); border-bottom: 2px solid var(--border-accent); white-space: nowrap; }
.sy-table th.num { text-align: right; } .sy-table th.ctr, .sy-table td.ctr { text-align: center; }
.sy-table td { padding: 8px 10px; vertical-align: top; border-top: 1px solid var(--border); }
.sy-table td.small { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
.sy-table .sid { color: var(--accent); font-weight: 700; text-decoration: none; }
.th-sort { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
.th-sort:hover { color: var(--text-primary); }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--accent); }
th[aria-sort="ascending"] .th-sort::after { content: " ▲"; font-size: 10px; } th[aria-sort="descending"] .th-sort::after { content: " ▼"; font-size: 10px; }
.sy-cat { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
.sy-cat-m { flex: none; width: 16px; font-weight: 800; color: var(--c); }
.sy-cat-b { flex: 1; min-width: 0; }
.sy-cat-w { font-size: 12.5px; color: var(--text-primary); line-height: 1.4; }
.sy-cat-y { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; margin-top: 2px; }
.sy-cat-c { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-top: 2px; }
.sy-cat-now { color: var(--c); }
.sy-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 10px; }
.sy-tile { padding: 10px 14px; background: var(--bg-primary); border-radius: 8px; border-left: 3px solid var(--c); }
.sy-tile-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.sy-tile-n { font-size: 12px; font-weight: 700; color: var(--text-primary); overflow-wrap: anywhere; }
.sy-tile-p { font-size: 12px; font-weight: 700; color: var(--c); }
.sy-bar { height: 6px; background: var(--bg-card); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.sy-bar > div { height: 100%; background: var(--c); }
.sy-bar-lg { height: 10px; border-radius: 5px; flex: 1; margin: 0; background: var(--bg-primary); }
.sy-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.sy-sum { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.sy-k { display: flex; gap: 18px; flex-wrap: wrap; }
.sy-k > div { text-align: center; }
.sy-k-h { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.sy-k-b { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.c-green { color: var(--green); } .c-amber { color: var(--amber); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-accent { color: var(--accent); } .c-muted { color: var(--text-muted); }
.sy-score { display: flex; align-items: center; gap: 16px; }
.sy-score-n { font-size: 36px; font-weight: 900; line-height: 1; color: var(--c); }
.sy-score-g { font-size: 32px; font-weight: 800; padding: 8px 18px; border: 3px solid var(--c); border-radius: 12px; line-height: 1; color: var(--c); }
.sy-bykind { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg-primary); border-radius: 8px; margin-bottom: 16px; font-size: 11px; color: var(--text-muted); }
.sy-bykind .end { margin-left: auto; }
.sy-filter { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; padding: 10px 14px; background: var(--bg-primary); border-radius: 8px; margin: 12px 0; }
.sy-filter .radio-group { flex-wrap: wrap; max-width: 100%; }
.sy-filter > div { min-width: 0; max-width: 100%; }
.sy-filter .grow-in { flex: 1; min-width: 200px; }
.sy-input { width: 100%; background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; }
.sy-fold-row { cursor: pointer; }
.sy-fold-row:hover { background: var(--bg-card-hover); }
.sy-tb-bad td { background: var(--red-bg); } .sy-tb-warn td { background: var(--amber-bg); }
.sy-exp { background: var(--bg-primary); }
.sy-factors { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 10px; padding: 14px 18px; }
.sy-factor { padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--c); border-radius: 6px; }
.sy-factor-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.sy-factor-n { font-size: 11px; font-weight: 700; color: var(--text-primary); text-transform: uppercase; letter-spacing: .5px; }
.sy-factor-s { font-size: 11px; font-weight: 700; color: var(--c); }
.sy-factor-m { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
.sy-factor-x { font-size: 10px; color: var(--text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
.sy-drill { display: inline-block; margin-top: 6px; padding: 3px 10px; font-size: 10px; background: var(--accent); color: var(--text-primary); border-radius: 4px; text-decoration: none; font-weight: 600; }
.sy-chev { background: none; border: 0; padding: 0; color: var(--text-muted); font-size: 10px; cursor: pointer; }
.sy-tname { font-weight: 700; color: var(--accent); }
.sy-kind { font-size: 10px; color: var(--text-muted); margin-left: 6px; }
.sy-tiles-lg { display: flex; flex-wrap: wrap; gap: 10px; }
.sy-ft { flex: 1 1 110px; background: var(--bg-primary); border-radius: 8px; padding: 10px 12px; min-width: 110px; }
.sy-ft-h { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.sy-ft-n { font-size: 24px; font-weight: 700; color: var(--c, var(--text-primary)); line-height: 1.1; }
.sy-ft:not([class*="st-"]) .sy-ft-n { color: var(--text-primary); }
.sy-ft-s { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.sy-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; font-style: italic; }
.sy-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sy-chip { font-size: 11px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-secondary); }
.sy-chip.bad { background: var(--red-bg); color: var(--red); } .sy-chip.info { background: var(--blue-bg); color: var(--blue); }
.sy-letters { display: flex; gap: 8px; }
.sy-letters > div { text-align: center; min-width: 32px; }
.sy-letters .l { font-size: 10px; color: var(--text-muted); } .sy-letters .n { font-size: 16px; font-weight: 700; color: var(--c); }
.sy-nat { display: inline-block; font-size: 10px; padding: 1px 6px; margin-left: 4px; background: var(--accent-soft); border: 1px solid var(--c, var(--accent)); color: var(--c, var(--accent)); border-radius: 3px; font-weight: 700; vertical-align: middle; }
.sy-sm { font-size: 10px; color: var(--text-muted); }
.sy-ok { color: var(--green); } 
.sy-fill-red { background: var(--red-bg); color: var(--red); } 
.sy-pill-out { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px; color: var(--c); border: 1px solid var(--c); font-weight: 700; letter-spacing: .5px; }
.sy-wrap { max-width: 320px; overflow-wrap: anywhere; }
.pipe-fail { color: var(--red); } .pipe-ok { color: var(--green); } .pipe-run { color: var(--amber); }

/* Data Inventory (tab fetched on first open; behaviour in /static/inventory.js) */
.pill-accent { background: var(--accent-soft); color: var(--accent); }
details.inv-domain { margin-top: 18px; }
details.inv-domain summary::-webkit-details-marker { display: none; }
details.inv-domain summary { display: flex; align-items: center; gap: 10px; padding: 8px 4px; cursor: pointer; border-bottom: 1px solid var(--border); user-select: none; list-style: none; }
details.inv-domain[open] .inv-arrow::before { content: "▾"; }
details.inv-domain:not([open]) .inv-arrow::before { content: "▸"; }
details.inv-domain .inv-arrow { width: 14px; font-size: 12px; }
details.inv-domain .inv-arrow::before { color: var(--text-muted); }
details.inv-domain .inv-domain-title { font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-primary); }
details.inv-domain .inv-domain-count { font-size: 11px; color: var(--text-muted); }
.inv-table-wrap { overflow-x: auto; margin-top: 8px; }
table.inv-table { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--text-secondary); }
table.inv-table thead th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted);
                           padding: 10px 12px; white-space: nowrap; border-bottom: 2px solid var(--border-accent); user-select: none; }
table.inv-table thead th.num { text-align: right; }
table.inv-table thead th.dragging { opacity: .4; }
table.inv-table thead th.drag-over { box-shadow: inset 2px 0 0 var(--accent); }
table.inv-table tbody tr { border-bottom: 1px solid var(--border); }
table.inv-table tbody tr:hover { background: var(--bg-card-hover); }
table.inv-table tbody td { padding: 10px 12px; vertical-align: middle; white-space: nowrap; }
table.inv-table tbody td.num { text-align: right; }
table.inv-table tbody td.inv-wrap { white-space: normal; min-width: 340px; max-width: 520px; overflow-wrap: anywhere; }
table.inv-table .inv-clamp { all: unset; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
table.inv-table .inv-clamp.open { display: block; }
table.inv-table .inv-clamp:focus-visible { outline: 1px solid var(--accent); }
table.inv-table .inv-faint { color: var(--text-muted); }
table.inv-table .inv-strong { color: var(--text-primary); font-weight: 600; }
table.inv-table .inv-table-name { font-weight: 700; color: var(--accent); text-decoration: none; }
.sy-section { margin-bottom: 18px; }
.st-info-blue { --c: var(--blue); } .st-accent { --c: var(--accent); }
.sy-factors-t { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.sy-block { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
.sy-h3 { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; }
.sy-dim { opacity: .75; }
.sy-flag-list { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.sy-flag { font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-secondary); }
.sy-flag.bad { background: var(--red-bg); } .sy-flag.info { background: var(--blue-bg); }
.sy-issue-pill { margin: 0 3px 3px 0; }
.sy-ft.st-ok .sy-ft-n, .sy-ft[class*="st-"] .sy-ft-n { color: var(--c); }
.sy-mt8 { margin-top: 8px; } .sy-cap { text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.sy-cc { color: var(--c); } .c-primary { color: var(--text-primary); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.section-desc.sy-nomb { margin-bottom: 0; }
.sy-fold-body { margin-top: 10px; }
</style>
